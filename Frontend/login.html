<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RideCentric LIVE | Dispatch Access</title>
    <script>
        // Apply the saved theme before first paint
        try { if (localStorage.getItem('rc-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app/Style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-brand">
            <svg width="34" height="34" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" fill="#1fa64a"/><path d="M8 19V7h6.2a3.6 3.6 0 0 1 .4 7.2L18 19h-2.7l-3-4.7H10.4V19H8zm2.4-6.8h3.6a1.5 1.5 0 0 0 0-3h-3.6v3z" fill="#fff"/></svg>
            <span>RideCentric</span><span class="chip-live">LIVE</span>
        </div>
        <div class="auth">
            <div class="auth-box">
                <h1>Login</h1>
                <p class="sub">Existing User</p>

                <label for="login-username">USERNAME</label>
                <input type="text" id="login-username" autocomplete="username">
                <label for="login-password">PASSWORD</label>
                <input type="password" id="login-password" autocomplete="current-password">

                <button class="go" type="button" onclick="attemptLogin()">LOGIN</button>
                <div id="login-error-msg" class="error-msg"></div>
            </div>

            <div class="auth-box second">
                <h1>Sign Up</h1>
                <p class="sub">New User</p>

                <label for="signup-username">USERNAME</label>
                <input type="text" id="signup-username" autocomplete="off">
                <label for="signup-password">PASSWORD</label>
                <input type="password" id="signup-password" autocomplete="new-password">

                <button class="go alt" type="button" onclick="attemptSignUp()">SIGN UP</button>
                <div id="signup-error-msg" class="error-msg"></div>
            </div>
        </div>
    </div>

    <script>
        // Send user straight to dashboard if they are already logged in
        if (localStorage.getItem('ridecentric_token')) window.location.href = '/app/dashboard.html';

        async function attemptLogin() {
            const u = (document.getElementById('login-username') || { value: '' }).value;
            const p = (document.getElementById('login-password') || { value: '' }).value;
            const err = document.getElementById('login-error-msg');
            err.className = 'error-msg';
            err.innerText = "Authenticating...";

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('ridecentric_token', data.token);
                    window.location.href = '/app/dashboard.html';
                } else {
                    const body = await res.json();
                    if (Array.isArray(body.detail)) {
                        err.innerText = body.detail.map(d => d.msg).join(', ');
                    } else {
                        err.innerText = body.detail || 'Login failed';
                    }
                }
            } catch (e) {
                err.innerText = "✕ System offline. Check backend terminal.";
            }
        }

        async function attemptSignUp() {
            const u = (document.getElementById('signup-username') || { value: '' }).value;
            const p = (document.getElementById('signup-password') || { value: '' }).value;
            const err = document.getElementById('signup-error-msg');
            err.className = 'error-msg';
            err.innerText = "Creating user...";

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (res.ok) {
                    err.className = 'error-msg ok';
                    err.innerText = "✓ User created, now login";
                } else {
                    const body = await res.json();
                    if (Array.isArray(body.detail)) {
                        err.innerText = body.detail.map(d => d.msg).join(', ');
                    } else {
                        err.innerText = body.detail || 'Sign-up failed';
                    }
                }
            } catch (e) {
                err.innerText = "✕ System offline. Check backend terminal.";
            }
        }

        // Allow hitting "Enter" to login from login inputs
        document.addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                const activeElement = document.activeElement;
                if (activeElement.id === 'login-username' || activeElement.id === 'login-password') {
                    attemptLogin();
                } else if (activeElement.id === 'signup-username' || activeElement.id === 'signup-password') {
                    attemptSignUp();
                }
            }
        });
    </script>
</body>
</html>
