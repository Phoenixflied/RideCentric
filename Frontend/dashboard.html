<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RideCentric LIVE | Dispatch</title>
    <script>
        // Apply the saved theme before first paint (avoids a light flash in dark mode)
        try { if (localStorage.getItem('rc-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    </script>
    <link rel="stylesheet" href="/app/Style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" fill="#1fa64a"/><path d="M8 19V7h6.2a3.6 3.6 0 0 1 .4 7.2L18 19h-2.7l-3-4.7H10.4V19H8zm2.4-6.8h3.6a1.5 1.5 0 0 0 0-3h-3.6v3z" fill="#fff"/></svg>
            <span>RideCentric</span><span class="chip-live">LIVE</span>
        </div>
        <button class="btn-pill" id="add-btn" type="button">+ ADD FLIGHT</button>
        <nav class="tabs" aria-label="Section"><span>Flights</span></nav>
        <div class="tools">
            <span id="clock" class="num">00:00:00</span>
            <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode" title="Dark / light"></button>
            <button class="logout" id="logout-btn" type="button">Logout</button>
        </div>
    </header>

    <main class="page">
        <div class="summary" id="summary"></div>
        <div class="layout">
            <section class="card" id="list-card">
                <div class="toolbar">
                    <div class="search">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                        <input id="search-bar" type="search" placeholder="flight, airline, ride…" aria-label="Search flights">
                    </div>
                    <input class="dateinp" type="date" id="date-picker" aria-label="Filter by date">
                    <div class="stepper" role="group" aria-label="Date navigation">
                        <button type="button" id="d-prev" title="Previous day">&#8249;</button>
                        <button type="button" class="today" id="d-today">Today</button>
                        <button type="button" id="d-next" title="Next day">&#8250;</button>
                    </div>
                    <button class="tbtn" id="show-all" type="button">Show all</button>
                    <button class="tbtn solid" id="scan-btn" type="button">&#8635; Scan PDF</button>
                    <span class="scan-status" id="scan-status" role="status"></span>
                    <label class="switch" title="Reload the flight list every 30 seconds"><input type="checkbox" id="auto" checked><span>Auto-refresh</span><span class="livedot"></span></label>
                </div>
                <div class="table-wrap" id="data-panel"><table class="grid" id="grid"><thead></thead><tbody></tbody></table></div>
                <div class="foot" id="foot"></div>
            </section>

            <aside class="side" id="side">
                <section class="card dcard" id="detail-card" aria-live="polite"></section>
                <section class="card map-card">
                    <div id="map"></div>
                    <div class="map-hint" id="map-hint"></div>
                </section>
            </aside>
        </div>
    </main>

    <!-- Add flight -->
    <div class="overlay" id="manual-modal-v3" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
            <div class="modal-head"><h3 id="m-title">Add manual arrival</h3><button class="x" data-close type="button" aria-label="Close">&times;</button></div>
            <form id="manual-flight-form">
                <div class="modal-body">
                    <div class="fgrid">
                        <div><label for="m-flight">FLIGHT #</label><input type="text" id="m-flight" placeholder="AA123" required></div>
                        <div><label for="m-arrival">ARRIVAL TIME</label><input type="time" id="m-arrival" required></div>
                        <div class="full"><label for="m-date">DATE</label><input type="date" id="m-date" required></div>
                        <div><label for="m-term">TERM</label><input type="text" id="m-term" placeholder="TBD"></div>
                        <div><label for="m-gate">GATE</label><input type="text" id="m-gate" placeholder="TBD"></div>
                    </div>
                </div>
                <div class="modal-foot"><button class="sbtn" data-close type="button">Cancel</button><button class="sbtn primary" type="submit">Save to database</button></div>
            </form>
        </div>
    </div>

    <div id="toast" role="status"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app/script.js"></script>
</body>
</html>
